name: Deploy to AWS

# Builds the site and publishes it to S3 + CloudFront on every push to main.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (IAM user "zynera-deployer", see DEPLOY.md)
#   S3_BUCKET                                   e.g. zyneraconnect-site
#   CLOUDFRONT_DISTRIBUTION_ID                  e.g. E1ABCDEF234567
#   AWS_REGION                                  e.g. ap-southeast-1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload hashed assets (cached for 1 year)
        run: aws s3 sync dist/assets s3://${{ secrets.S3_BUCKET }}/assets --delete --cache-control "public,max-age=31536000,immutable"

      - name: Upload everything else (always revalidated)
        run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete --exclude "assets/*" --cache-control "public,max-age=0,must-revalidate"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
